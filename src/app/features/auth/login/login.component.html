<div class="login-container">
  <mat-card class="login-card">
    <!-- Header -->
    <mat-card-header>
      <mat-card-title>Incident Management</mat-card-title>
      <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <!-- Formulario -->
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Campo Username -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username">
          <mat-icon matPrefix>person</mat-icon>

          <!-- Mensajes de error -->
          <mat-error *ngIf="username?.hasError('required')">
            El usuario es obligatorio
          </mat-error>
          <mat-error *ngIf="username?.hasError('minlength')">
            Mínimo 3 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Campo Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password">
          <mat-icon matPrefix>lock</mat-icon>

          <!-- Botón para mostrar/ocultar contraseña -->
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Ocultar contraseña'"
            [attr.aria-pressed]="hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>

          <!-- Mensajes de error -->
          <mat-error *ngIf="password?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>
          <mat-error *ngIf="password?.hasError('minlength')">
            Mínimo 6 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Botón Submit -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-button"
          [disabled]="loading">

          <mat-spinner
            *ngIf="loading"
            diameter="20"
            class="button-spinner">
          </mat-spinner>

          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading">Iniciando...</span>
        </button>
      </form>
    </mat-card-content>

    <!-- Footer -->
    <mat-card-footer>
      <p class="register-link">
        ¿No tienes cuenta?
        <a routerLink="/register" class="link">Regístrate aquí</a>
      </p>
    </mat-card-footer>
  </mat-card>
</div>
