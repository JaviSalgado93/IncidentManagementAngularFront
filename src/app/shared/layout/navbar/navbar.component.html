<!-- Version navbar navbar-blue-dark -->
<mat-toolbar class="navbar navbar-blue-dark">

  <!-- Botón hamburguesa (solo en mobile) -->
  <button
    mat-icon-button
    class="menu-button"
    (click)="toggleSidebar()"
    aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Logo y título -->
  <div class="logo-section">
    <mat-icon class="logo-icon">bug_report</mat-icon>
    <span class="app-title">Incident Management</span>
  </div>

  <!-- Spacer (empuja contenido a la derecha) -->
  <span class="spacer"></span>

  <!-- Usuario y menú -->
  <div class="user-section" *ngIf="currentUser$ | async as user">
    <!-- Nombre del usuario (oculto en mobile) -->
    <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>

    <!-- Menú de usuario -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        <p class="user-menu-name">{{ user.firstName }} {{ user.lastName }}</p>
        <p class="user-menu-email">{{ user.email }}</p>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>person</mat-icon>
        <span>Mi Perfil</span>
      </button>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
