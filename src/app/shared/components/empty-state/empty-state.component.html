<div class="empty-state">
  <mat-icon class="empty-icon">{{ icon }}</mat-icon>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-message">{{ message }}</p>

  <button
    *ngIf="actionText"
    mat-raised-button
    color="primary"
    (click)="onAction()">
    {{ actionText }}
  </button>
</div>
