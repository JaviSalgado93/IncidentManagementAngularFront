<div class="confirm-dialog">
  <div class="dialog-header" [ngClass]="'type-' + type">
    <mat-icon class="dialog-icon">{{ getIcon() }}</mat-icon>
    <h2 mat-dialog-title>{{ title }}</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p>{{ message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button
      mat-button
      (click)="onCancel()">
      {{ cancelText }}
    </button>
    <button
      mat-raised-button
      [color]="type === 'danger' ? 'warn' : 'primary'"
      (click)="onConfirm()">
      {{ confirmText }}
    </button>
  </mat-dialog-actions>
</div>
